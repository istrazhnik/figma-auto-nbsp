<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font: 11px/16px Inter, system-ui, -apple-system, sans-serif;
    color: var(--figma-color-text, #333);
    background: var(--figma-color-bg, #fff);
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .muted { color: var(--figma-color-text-secondary, #666); }

  .main { flex: 1; overflow: auto; padding: 12px; }
  .foot {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 22px 8px 12px; border-top: 1px solid var(--figma-color-border, #e5e5e5);
  }
  /* Уголок для изменения размера окна; поверх справки, чтобы работал и в ней */
  .grip {
    position: fixed; right: 0; bottom: 0; z-index: 20; width: 16px; height: 16px;
    display: grid; place-items: center; cursor: nwse-resize; touch-action: none;
    color: var(--figma-color-icon-tertiary, #b3b3b3);
  }
  .grip:hover { color: var(--figma-color-icon-secondary, #666); }
  .link {
    padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--figma-color-text-brand, #0d99ff);
  }
  .link:hover { text-decoration: underline; }

  .check { display: flex; align-items: center; gap: 8px; margin: 10px 0; cursor: pointer; user-select: none; }
  .check input { margin: 0; width: 14px; height: 14px; accent-color: var(--figma-color-bg-brand, #0d99ff); }

  .primary {
    width: 100%; height: 32px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #fff);
  }
  .primary:hover:not(:disabled) { background: var(--figma-color-bg-brand-hover, #0b87e0); }
  .primary:disabled { opacity: .4; cursor: default; }

  /* Найденные места */
  .grp { margin-top: 14px; }
  .grp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .grp-title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .grp-title::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .grp.nb .grp-title::before { background: var(--figma-color-icon-brand, #0d99ff); }
  .grp.dup .grp-title::before { background: var(--figma-color-icon-danger, #f24822); }
  .cnt { white-space: nowrap; color: var(--figma-color-text-secondary, #666); }
  .block {
    margin-top: 6px; padding: 6px; border-radius: 8px;
    background: var(--figma-color-bg-secondary, #f5f5f5);
  }
  .node {
    margin: 0 2px 4px; font-weight: 500; color: var(--figma-color-text-secondary, #666);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row {
    display: block; width: 100%; height: 28px; padding: 0 8px;
    text-align: left; line-height: 26px; white-space: pre; overflow: hidden; text-overflow: ellipsis;
    background: var(--figma-color-bg, #fff); border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 6px; cursor: pointer;
  }
  .row + .row { margin-top: 4px; }
  .row:hover { border-color: var(--figma-color-border-strong, #b3b3b3); }
  .row[aria-current="true"] {
    background: var(--figma-color-bg-selected, #e5f4ff);
    border-color: var(--figma-color-border-selected, #0d99ff);
  }
  .row:focus-visible { outline: 2px solid var(--figma-color-border-brand-strong, #0d99ff); outline-offset: -2px; }
  mark { border-radius: 2px; padding: 0 1px; font-weight: 700; }
  mark.nb { background: var(--figma-color-bg-brand-tertiary, #e5f4ff); color: var(--figma-color-text-brand, #0d99ff); }
  mark.dup { background: var(--figma-color-bg-danger-tertiary, #ffe2e0); color: var(--figma-color-text-danger, #f24822); }
  .more { margin-top: 2px; }
  .ok { margin-top: 14px; color: var(--figma-color-text-success, #14ae5c); }

  /* Справка */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    background: var(--figma-color-bg, #fff);
  }
  .overlay-head {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    height: 40px; padding: 0 8px 0 12px; font-weight: 600;
    border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
  }
  .close {
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; cursor: pointer;
    display: grid; place-items: center; background: transparent;
    color: var(--figma-color-icon, #333);
  }
  .close:hover { background: var(--figma-color-bg-hover, #f5f5f5); }
  .overlay-body { flex: 1; overflow: auto; padding: 0 12px 12px; }
  .help-intro { margin: 12px 0 4px; }
  .help-group { margin-top: 10px; }
  .help-title { font-weight: 600; }
  .help-text { margin-top: 2px; white-space: pre-wrap; word-break: break-word; color: var(--figma-color-text-secondary, #666); }
  .nbm { color: var(--figma-color-text-brand, #0d99ff); font-weight: 700; }
</style>
</head>
<body>
  <main class="main">
    <div id="sel" class="muted">Загрузка…</div>
    <label class="check">
      <input type="checkbox" id="annotate">
      <span>Добавить аннотацию</span>
    </label>
    <button id="run" class="primary" type="button" disabled>Расставить неразрывные пробелы</button>
    <div id="issues"></div>
  </main>

  <footer class="foot">
    <button id="helpLink" class="link" type="button">Как работает плагин</button>
    <span class="ver muted" title="Версия плагина">v1.0.0</span>
  </footer>
  <div id="grip" class="grip" title="Потяните, чтобы изменить размер окна" aria-hidden="true">
    <svg width="8" height="8" viewBox="0 0 8 8">
      <path d="M7.5 1.5l-6 6M7.5 4.5l-3 3" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="help" class="overlay" role="dialog" aria-labelledby="helpTitle" hidden>
    <div class="overlay-head">
      <span id="helpTitle">Как работает плагин</span>
      <button id="helpClose" class="close" type="button" title="Закрыть" aria-label="Закрыть">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="helpBody" class="overlay-body"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

  const plural = (n, one, few, many) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    return b === 1 ? one : many;
  };
  const layers = (n) => n + ' ' + plural(n, 'слой', 'слоя', 'слоёв');
  const places = (n) => n + ' ' + plural(n, 'место', 'места', 'мест');

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  // ------------------------------- Справка ---------------------------------
  // «_» в примерах — неразрывный пробел. Список нужно держать в соответствии с code.js.
  const HELP = [
    ['Проверка выделения',
      'Сразу при выделении слоёв (или фрейма с текстами) плагин показывает, где не хватает неразрывных пробелов ' +
      'и где стоят повторяющиеся пробелы. Нажмите на строку — слой и фрагмент будут выделены на холсте. ' +
      'Текст меняется только по кнопке «Расставить неразрывные пробелы».'],
    ['Повторяющиеся пробелы',
      'При нажатии на кнопку два и более пробела подряд заменяются одним. Если среди них был неразрывный, остаётся он. ' +
      'Оставшийся пробел становится неразрывным, если этого требуют правила ниже: «в  доме» → в_доме, «Он  пришёл» → Он_пришёл.'],
    ['Числа от четырёх цифр',
      '1_000, 12_345, 2_345_999. Уже набранные «1 000» с обычным пробелом тоже становятся неразрывными. ' +
      'Не трогаем: годы («2024 г.», «в ноябре 2026»), дробную часть (3,14159), даты 2024-11-10, ' +
      'идентификаторы (ID12345), числа с нуля (0123).'],
    ['Единицы после числа',
      '5_лет, 3_месяца, 10_сек, 2024_г., 100_000_руб., 5_тыс._руб., 500_г, 20_°C, 5_м².'],
    ['Проценты',
      '20_% — только если пробел перед знаком уже был. «20%» остаётся как есть. То же для ‰.'],
    ['Предлоги и союзы',
      'в_списке, первый и_второй, потому_что_хотел, потому,_что_хотел, для_того,_чтобы, так_как.'],
    ['Частицы «не», «ни», «вот», «вон», «ну», «уж», «то»',
      'Прижимаются к следующему слову: не_пошёл, вот_он.'],
    ['Частицы «бы», «ли», «же»',
      'Прижимаются к предыдущему слову: я_бы пошёл, знаешь_ли, он_же ушёл. После них пробел обычный.'],
    ['Короткие слова (1–2 буквы)',
      'я_пришёл, а_он, мы_ушли.'],
    ['Даты', '10_ноября_2026_г., в_ноябре_2026.'],
    ['Инициалы', 'А._С._Пушкин, Пушкин_А._С.'],
    ['Сокращения', 'т._е., и_т._д., и_т._п., в_т._ч.'],
    ['Номера и ссылки', '№_5, §_3, ст._12, п._4, рис._2, табл._1, гл._3.'],
    ['Адреса', 'г._Москва, ул._Ленина,_д._5,_кв._12. После запятой перед д., кв., оф., корп., эт., стр. пробел тоже неразрывный.'],
    ['Тире', 'Рынок_— это важно. Неразрывный пробел перед тире, после тире обычный.'],
    ['Телефоны', '+7_(495)_123-45-67, 8_800_555-35-35. Дефисы остаются обычными.'],
    ['Римские цифры и век', 'XXI_век, в_XX_в.'],
    ['Аннотация (галочка)',
      'К каждому слою добавляется одна аннотация с флагом «Текст»: текст слоя, где неразрывные пробелы записаны ' +
      'как &nbsp;. Чужие аннотации и аннотации «Текст» с другим содержимым (например, ссылки) не меняются. ' +
      'При повторном запуске обновляется только аннотация плагина.']
  ];

  function withMarks(parent, str) {
    str.split('_').forEach((part, i) => {
      if (i) parent.appendChild(el('span', 'nbm', '_'));
      parent.appendChild(document.createTextNode(part));
    });
  }

  function buildHelp() {
    const root = $('helpBody');
    const intro = el('div', 'help-intro muted');
    intro.appendChild(el('span', 'nbm', '_'));
    withMarks(intro, ' — неразрывный пробел. Новые пробелы плагин создаёт только внутри чисел (1000 → 1_000); ' +
      'во всех остальных случаях обычный пробел заменяется на неразрывный. Форматирование сохраняется.');
    root.appendChild(intro);

    HELP.forEach(([title, text]) => {
      const g = el('div', 'help-group');
      g.appendChild(el('div', 'help-title', title));
      const t = el('div', 'help-text');
      withMarks(t, text);
      g.appendChild(t);
      root.appendChild(g);
    });
  }

  function showHelp(on) {
    $('help').hidden = !on;
    if (on) { $('helpBody').scrollTop = 0; $('helpClose').focus(); }
    else $('helpLink').focus();
  }

  $('helpLink').addEventListener('click', () => showHelp(true));
  $('helpClose').addEventListener('click', () => showHelp(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('help').hidden) showHelp(false); });
  buildHelp();

  // ------------------------------- Основное --------------------------------
  let selCount = 0;
  let activeKey = '';

  $('run').addEventListener('click', () => {
    $('run').disabled = true;
    post({ type: 'run', annotate: $('annotate').checked });
  });
  $('annotate').addEventListener('change', (e) => post({ type: 'set-annotate', value: e.target.checked }));

  function group(root, kind, title, g) {
    if (!g.places) return;
    const box = el('section', 'grp ' + kind);
    const head = el('div', 'grp-head');
    head.appendChild(el('span', 'grp-title', title));
    head.appendChild(el('span', 'cnt', layers(g.nodes) + ' · ' + places(g.places)));
    box.appendChild(head);

    // Каждый слой — отдельный блок с названием сверху
    let lastId = null;
    let block = null;
    g.items.forEach((it) => {
      if (it.id !== lastId) {
        block = el('div', 'block');
        block.appendChild(el('div', 'node', it.name));
        box.appendChild(block);
        lastId = it.id;
      }
      const key = kind + ':' + it.id + ':' + it.s;
      const b = el('button', 'row');
      b.type = 'button';
      b.title = 'Показать в слое «' + it.name + '»';
      if (key === activeKey) b.setAttribute('aria-current', 'true');
      it.sn.forEach((p, i) => {
        if (i % 2) b.appendChild(el('mark', kind, p));
        else if (p) b.appendChild(document.createTextNode(p));
      });
      b.addEventListener('click', () => {
        const prev = document.querySelector('.row[aria-current]');
        if (prev) prev.removeAttribute('aria-current');
        b.setAttribute('aria-current', 'true');
        activeKey = key;
        post({ type: 'focus', id: it.id, s: it.s, e: it.e });
      });
      block.appendChild(b);
    });
    if (g.places > g.items.length) {
      box.appendChild(el('div', 'more muted', 'Показаны первые ' + g.items.length + ' из ' + g.places));
    }
    root.appendChild(box);
  }

  function render(m) {
    const root = $('issues');
    root.textContent = '';
    if (!m.count) return;
    if (!m.nbsp.places && !m.dups.places) {
      root.appendChild(el('div', 'ok', 'Всё в порядке: неразрывные пробелы на месте, повторов нет'));
      return;
    }
    group(root, 'nb', 'Не хватает неразрывных пробелов', m.nbsp);
    group(root, 'dup', 'Повторяющиеся пробелы', m.dups);
  }

  window.onmessage = (ev) => {
    const m = ev.data && ev.data.pluginMessage;
    if (!m) return;
    if (m.type === 'init') {
      $('annotate').checked = !!m.annotate;
    } else if (m.type === 'issues') {
      selCount = m.count;
      $('sel').textContent = m.count
        ? 'Выделено текстовых слоёв: ' + m.count
        : 'Выделите текстовый слой (или фрейм с текстами)';
      $('run').disabled = m.count === 0;
      render(m);
    } else if (m.type === 'done') {
      $('run').disabled = selCount === 0;
    }
  };

  // ------------------------------ Размер окна -------------------------------
  // Окно меняет код плагина (figma.ui.resize); отсюда шлём желаемый размер не чаще раза за кадр
  (() => {
    const grip = $('grip');
    let start = null;
    let size = null;
    let frame = 0;
    const send = (save) => post({ type: 'resize', w: size.w, h: size.h, save });

    grip.addEventListener('pointerdown', (e) => {
      start = { x: e.screenX, y: e.screenY, w: window.innerWidth, h: window.innerHeight };
      size = { w: start.w, h: start.h };
      grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grip.addEventListener('pointermove', (e) => {
      if (!start) return;
      size = { w: start.w + e.screenX - start.x, h: start.h + e.screenY - start.y };
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; send(false); });
    });
    const end = () => {
      if (!start) return;
      start = null;
      if (frame) { cancelAnimationFrame(frame); frame = 0; }
      send(true);
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('lostpointercapture', end);
  })();

  post({ type: 'ready' });
</script>
</body>
</html>
