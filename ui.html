<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 11px/16px Inter, system-ui, -apple-system, sans-serif;
    color: var(--figma-color-text, #333);
    background: var(--figma-color-bg, #fff);
  }
  button { font: inherit; color: inherit; }
  .muted { color: var(--figma-color-text-secondary, #666); }
  .section { margin-top: 12px; }
  [hidden] { display: none !important; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
  .icon {
    flex: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-weight: 600;
    background: transparent; border: 1px solid var(--figma-color-border, #e5e5e5);
    color: var(--figma-color-text-secondary, #666);
  }
  .icon:hover { background: var(--figma-color-bg-hover, #f5f5f5); }
  .icon[aria-pressed="true"] {
    background: var(--figma-color-bg-brand, #0d99ff);
    border-color: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #fff);
  }

  .check { display: flex; align-items: center; gap: 8px; margin: 12px 0; cursor: pointer; user-select: none; }
  .check input { margin: 0; width: 14px; height: 14px; accent-color: var(--figma-color-bg-brand, #0d99ff); }

  .primary {
    width: 100%; height: 32px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #fff);
  }
  .primary:hover:not(:disabled) { background: var(--figma-color-bg-brand-hover, #0b87e0); }
  .primary:disabled { opacity: .4; cursor: default; }

  .card { border: 1px solid var(--figma-color-border, #e5e5e5); border-radius: 6px; padding: 8px 10px; }
  .stat { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .stat b { font-weight: 600; }
  .head { font-weight: 600; margin-bottom: 4px; }
  .warn {
    background: var(--figma-color-bg-warning-tertiary, #fff4d6);
    border: 1px solid var(--figma-color-border-warning, #f5c04a);
    border-radius: 6px; padding: 8px 10px;
  }
  .ok {
    background: var(--figma-color-bg-success-tertiary, #e3f7ea);
    border: 1px solid var(--figma-color-border-success, #7ad39b);
    border-radius: 6px; padding: 8px 10px;
  }
  .dup-item {
    display: block; width: 100%; text-align: left; margin-top: 6px; padding: 6px 8px; cursor: pointer;
    background: var(--figma-color-bg, #fff);
    border: 1px solid var(--figma-color-border, #e5e5e5); border-radius: 6px;
  }
  .dup-item:hover { background: var(--figma-color-bg-hover, #f5f5f5); }
  .dup-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx, .ex { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .ctx { margin-top: 2px; word-break: break-all; }
  .ctx mark {
    border-radius: 2px; padding: 0 1px;
    background: var(--figma-color-bg-danger, #f24822);
    color: var(--figma-color-text-onbrand, #fff);
  }
  .legend, .skip { margin-top: 6px; }

  /* Справка */
  .help-intro { margin: 12px 0 4px; }
  .help-group { margin-top: 10px; }
  .help-title { font-weight: 600; }
  .help-text { margin-top: 2px; color: var(--figma-color-text-secondary, #666); }
  .ex { margin-top: 2px; }
  .nb { color: var(--figma-color-text-brand, #0d99ff); font-weight: 700; }
</style>
</head>
<body>
  <div class="top">
    <div id="sel" class="muted">Загрузка…</div>
    <button id="helpBtn" class="icon" type="button" aria-pressed="false"
            title="Справка: где ставятся неразрывные пробелы" aria-label="Справка">?</button>
  </div>

  <div id="main">
    <label class="check">
      <input type="checkbox" id="annotate">
      <span>Добавить аннотацию</span>
    </label>
    <button id="run" class="primary" type="button" disabled>Расставить неразрывные пробелы</button>
    <div id="result"></div>
  </div>

  <div id="help" hidden></div>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

  const plural = (n, one, few, many) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    return b === 1 ? one : many;
  };

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  // ------------------------------- Справка ---------------------------------
  // «_» в примерах — неразрывный пробел. Список нужно держать в соответствии с code.js.
  const HELP = [
    ['Числа от четырёх цифр',
      '1_000, 12_345, 2_345_999. Уже набранные «1 000» с обычным пробелом тоже становятся неразрывными. ' +
      'Не трогаем: годы («2024 г.», «в ноябре 2026»), дробную часть (3,14159), даты 2024-11-10, ' +
      'идентификаторы (ID12345), числа с нуля (0123).'],
    ['Единицы после числа',
      '5_лет, 3_месяца, 10_сек, 2024_г., 100_000_руб., 5_тыс._руб., 500_г, 20_°C, 5_м².'],
    ['Проценты',
      '20_% — только если пробел перед знаком уже был. «20%» остаётся как есть. То же для ‰.'],
    ['Предлоги и союзы',
      'в_списке, первый и_второй, потому_что_хотел, потому,_что_хотел, для_того,_чтобы, так_как.'],
    ['Частицы «не», «ни», «вот», «вон», «ну», «уж», «то»',
      'Прижимаются к следующему слову: не_пошёл, вот_он.'],
    ['Частицы «бы», «ли», «же»',
      'Прижимаются к предыдущему слову: я_бы пошёл, знаешь_ли, он_же ушёл. После них пробел обычный.'],
    ['Короткие слова (1–2 буквы)',
      'я_пришёл, а_он, мы_ушли.'],
    ['Даты', '10_ноября_2026_г., в_ноябре_2026.'],
    ['Инициалы', 'А._С._Пушкин, Пушкин_А._С.'],
    ['Сокращения', 'т._е., и_т._д., и_т._п., в_т._ч.'],
    ['Номера и ссылки', '№_5, §_3, ст._12, п._4, рис._2, табл._1, гл._3.'],
    ['Адреса', 'г._Москва, ул._Ленина,_д._5,_кв._12. После запятой перед д., кв., оф., корп., эт., стр. пробел тоже неразрывный.'],
    ['Тире', 'Рынок_— это важно. Неразрывный пробел перед тире, после тире обычный.'],
    ['Телефоны', '+7_(495)_123-45-67, 8_800_555-35-35. Дефисы остаются обычными.'],
    ['Римские цифры и век', 'XXI_век, в_XX_в.'],
    ['Аннотация (галочка)',
      'К каждому слою добавляется одна аннотация с флагом «Текст»: текст слоя, где неразрывные пробелы записаны ' +
      'как &nbsp;. Чужие аннотации и аннотации «Текст» с другим содержимым (например, ссылки) не меняются. ' +
      'При повторном запуске обновляется только аннотация плагина.'],
    ['Повторы пробелов',
      'Два и более пробела подряд (обычных и неразрывных) показываются в списке. Нажмите на строку — ' +
      'слой и фрагмент будут выделены на холсте. Плагин их не удаляет.']
  ];

  function withMarks(parent, str) {
    str.split('_').forEach((part, i) => {
      if (i) parent.appendChild(el('span', 'nb', '_'));
      parent.appendChild(document.createTextNode(part));
    });
  }

  function buildHelp() {
    const root = $('help');
    const intro = el('div', 'help-intro muted');
    intro.appendChild(el('span', 'nb', '_'));
    withMarks(intro, ' — неразрывный пробел. Новые пробелы плагин создаёт только внутри чисел (1000 → 1_000); ' +
      'во всех остальных случаях обычный пробел заменяется на неразрывный.');
    root.appendChild(intro);

    HELP.forEach(([title, text]) => {
      const g = el('div', 'help-group');
      g.appendChild(el('div', 'help-title', title));
      const t = el('div', 'help-text ex');
      withMarks(t, text);
      g.appendChild(t);
      root.appendChild(g);
    });
  }

  function toggleHelp(show) {
    const on = show === undefined ? $('help').hidden : show;
    $('help').hidden = !on;
    $('main').hidden = on;
    $('helpBtn').setAttribute('aria-pressed', String(on));
    window.scrollTo(0, 0);
  }

  $('helpBtn').addEventListener('click', () => toggleHelp());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleHelp(false); });
  buildHelp();

  // ------------------------------- Основное --------------------------------
  // Видимые маркеры пробелов: · — обычный, ° — неразрывный
  const visible = (s) => s.replace(/ /g, '·').replace(/[\u00A0\u202F]/g, '°');

  let selCount = 0;

  function runNow() {
    $('run').disabled = true;
    post({ type: 'run', annotate: $('annotate').checked });
  }

  $('run').addEventListener('click', runNow);
  $('annotate').addEventListener('change', (e) => {
    post({ type: 'set-annotate', value: e.target.checked });
    if (e.target.checked && selCount > 0) runNow();
  });

  function stat(parent, label, value) {
    const row = el('div', 'stat');
    row.appendChild(el('span', 'muted', label));
    row.appendChild(el('b', '', String(value)));
    parent.appendChild(row);
  }

  function render(r) {
    const root = $('result');
    root.textContent = '';
    if (r.total === 0) return;

    // Сводка
    const sum = el('div', 'card section');
    sum.appendChild(el('div', 'head', 'Результат'));
    stat(sum, 'Обработано слоёв', r.total);
    stat(sum, 'Изменено слоёв', r.changedNodes);
    stat(sum, 'Поставлено неразрывных пробелов', r.nbspPlaced);
    if (r.annotate) {
      stat(sum, 'Аннотации: добавлено', r.annotations.added);
      stat(sum, 'Аннотации: обновлено', r.annotations.updated);
      stat(sum, 'Аннотации: без изменений', r.annotations.same);
    }
    root.appendChild(sum);

    // Повторы пробелов
    if (r.dupTotal) {
      const box = el('div', 'warn section');
      box.appendChild(el('div', 'head',
        'Повторяющиеся пробелы: ' + r.dupTotal + ' ' + plural(r.dupTotal, 'место', 'места', 'мест')));
      box.appendChild(el('div', 'muted', 'Нажмите на строку, чтобы выделить фрагмент в слое.'));

      r.dups.forEach((d) => {
        const b = el('button', 'dup-item');
        b.type = 'button';
        b.appendChild(el('div', 'dup-name', d.nodeName));
        const ctx = el('div', 'ctx');
        ctx.appendChild(document.createTextNode(visible(d.before)));
        ctx.appendChild(el('mark', '', visible(d.dup)));
        ctx.appendChild(document.createTextNode(visible(d.after)));
        b.appendChild(ctx);
        b.addEventListener('click', () => post({ type: 'focus', nodeId: d.nodeId, start: d.start, end: d.end }));
        box.appendChild(b);
      });
      if (r.dupTotal > r.dups.length) {
        box.appendChild(el('div', 'muted legend', 'Показаны первые ' + r.dups.length + '.'));
      }
      box.appendChild(el('div', 'muted legend', '· — обычный пробел, ° — неразрывный'));
      root.appendChild(box);
    } else {
      root.appendChild(el('div', 'ok section', 'Повторяющихся пробелов не найдено'));
    }

    // Пропущенные слои / ошибки
    if (r.skipped.length) {
      const box = el('div', 'card section');
      box.appendChild(el('div', 'head', 'Не обработано'));
      r.skipped.forEach((s) => box.appendChild(el('div', 'skip', s.name + ' — ' + s.reason)));
      root.appendChild(box);
    }
  }

  window.onmessage = (ev) => {
    const m = ev.data && ev.data.pluginMessage;
    if (!m) return;
    if (m.type === 'init') {
      $('annotate').checked = !!m.annotate;
    } else if (m.type === 'selection') {
      selCount = m.count;
      $('sel').textContent = m.count
        ? 'Выделено текстовых слоёв: ' + m.count
        : 'Выделите текстовый слой (или фрейм с текстами)';
      $('run').disabled = m.count === 0;
    } else if (m.type === 'report') {
      $('run').disabled = selCount === 0;
      render(m);
    }
  };

  post({ type: 'ready' });
</script>
</body>
</html>
